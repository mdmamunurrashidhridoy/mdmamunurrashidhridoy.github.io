{{ define "main" }}
<article class="container post">
  <header class="post__head measure">
    <p class="meta"><a href="{{ "writing/" | relURL }}">&larr; Writing</a></p>
    <h1>{{ .Title }}</h1>
    <p class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time> · {{ .ReadingTime }} min read</p>
  </header>
  <div class="prose measure">{{ .Content }}</div>
</article>
{{ end }}
