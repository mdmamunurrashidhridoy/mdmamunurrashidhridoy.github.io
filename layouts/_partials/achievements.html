<section class="section" id="achievements" aria-labelledby="achievements-title">
  <div class="container section-grid reveal">
    <header class="section-head"><h2 id="achievements-title">Achievements</h2></header>
    <ul class="achievements">
      {{ range hugo.Data.achievements.items }}
      <li><strong>{{ .title }}</strong><span class="meta">{{ .term }}</span></li>
      {{ end }}
    </ul>
  </div>
</section>
