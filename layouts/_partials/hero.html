<section class="hero" aria-labelledby="hero-title">
  <div class="container">
    <p class="eyebrow">Computer Science · Data Science · Machine Learning · NLP · Research</p>
    <h1 id="hero-title">{{ .Params.intro }}</h1>
    {{ with .Params.affiliation }}<p class="meta">{{ . }}</p>{{ end }}
    <ul class="tags" aria-label="Research interests">
      {{ range hugo.Data.research.items }}<li>{{ .title }}</li>{{ end }}
    </ul>
    <div class="hero__actions">
      <a class="btn btn--primary" href="mailto:{{ site.Params.email }}">Get in touch {{ partial "icon.html" (dict "name" "arrow-right") }}</a>
      <a class="link-arrow" href="#about">About me</a>
    </div>
  </div>
</section>
