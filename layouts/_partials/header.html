<header class="site-header" data-scrolled="false" data-open="false">
  <div class="container site-header__inner">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="Hridoy, home">{{ partial "monogram.html" . }}<span>Hridoy</span></a>
    <nav id="site-nav" class="site-nav" aria-label="Primary">
      <ul>
        {{ range site.Menus.main }}
        <li><a href="{{ .URL | relURL }}">{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
    <div class="site-header__actions">
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle color theme">
        {{ partial "icon.html" (dict "name" "sun" "class" "icon-sun") }}
        {{ partial "icon.html" (dict "name" "moon" "class" "icon-moon") }}
      </button>
      <button class="icon-btn nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
        {{ partial "icon.html" (dict "name" "menu" "class" "icon-menu") }}
        {{ partial "icon.html" (dict "name" "x" "class" "icon-close") }}
      </button>
    </div>
  </div>
</header>
